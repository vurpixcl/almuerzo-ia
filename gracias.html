<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gracias | Vurpix</title>
  

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f8fb;
      --blue: #245BDB;
      --purple: #6624A2;
      --pink: #FF45A6;
      --text: #241D2B;
      --muted: #746d7b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Sora", Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(49,196,195,.10), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(255,69,166,.08), transparent 26%),
        var(--bg);
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--text);
    }

    .container {
      width: min(600px, calc(100% - 40px));
      padding: 40px 20px;
    }

    .logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 34px;
    }

    .logo-vurpix {
      width: 190px;
      max-width: 42vw;
      height: auto;
      display: block;
    }

    .separator {
      width: 1px;
      height: 38px;
      background: #ddd9e2;
    }

    .logo-partner {
      width: 150px;
      max-width: 34vw;
      height: auto;
      display: block;
    }

    .check {
      width: 62px;
      height: 62px;
      margin: 0 auto 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(36,91,219,.08);
      color: var(--blue);
      font-size: 30px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 16px;
      color: var(--blue);
      font-size: clamp(2rem, 7vw, 2.8rem);
      line-height: 1.12;
      letter-spacing: -0.04em;
      font-weight: 800;
    }

    p {
      margin: 0 auto 32px;
      max-width: 520px;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.7;
    }

    p strong {
      color: var(--text);
      font-weight: 600;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(102,36,162,.16);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(102,36,162,.20);
    }

    @media (max-width: 480px) {
      .container { padding: 32px 10px; }
      .logos { gap: 14px; margin-bottom: 28px; }
      .logo-vurpix { width: 155px; }
      .logo-partner { width: 120px; }
      .separator { height: 32px; }
      p { font-size: 1rem; }
    }
  </style>
<meta name="robots" content="noindex,follow">
</head>

<body>
  <main class="container">
    <div class="logos" aria-label="Vurpix, Salesforce Partner">
      <img class="logo-vurpix" src="assets/logo-vurpix.png" alt="Vurpix">
      <span class="separator" aria-hidden="true"></span>
      <img class="logo-partner" src="assets/salesforce-partner.png" alt="Salesforce Partner">
    </div>

    <div class="check" aria-hidden="true">✓</div>

    <h1>¡Gracias por registrarte!</h1>

    <p>
      Hemos recibido tu solicitud.<br>
      <strong>Te contactaremos por WhatsApp para confirmar tu participación.</strong>
    </p>

    <a class="btn" href="index.html">Volver al inicio</a>
  </main>
</body>
</html>
